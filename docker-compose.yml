services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mini-snapp_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-MiniSnapp!2026}"
    
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"
        ]
      
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mini-snapp-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DB_HOST: "sqlserver"
      DB_PORT: "1433"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-MiniSnapp!2026}"
    volumes:
      - ./:/workspace:ro
    working_dir: /workspace
    entrypoint: ["/bin/bash", "/workspace/scripts/deploy_and_test.sh"]

volumes:
  mssql_data: